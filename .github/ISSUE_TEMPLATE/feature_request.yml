name: Feature request
description: Suggest a feature, for example a py4DSTEM analysis the app does not have yet
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like to do?
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: The py4DSTEM function or paper this follows, if any
  - type: textarea
    id: notes
    attributes:
      label: Anything else (data format and size, the output you need)

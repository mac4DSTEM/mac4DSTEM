# CI — the aggregate claim, made mechanical (v2 S21, docs/archive/v2/v2-release.md §8).
#
# WHAT RUNS on every push and pull request: the two Track A gates a public
# checkout can reproduce —
#   * `tools/run-tests.sh unit`        — the fast XCTest suite
#   * `tools/run-tests.sh scientific`  — every harness in that script's
#     `scientific` array (the array is the roster; no count is stated here so
#     this comment cannot go stale). Each builds its fixtures synthetically or
#     reads small committed files and compiles production Core/ sources
#     standalone; the py4DSTEM-parity harnesses among them compare against the
#     pinned source lock (References/py4DSTEM-dev, fetched by
#     tools/lib/fetch-py4dstem.sh at one upstream commit), with the
#     numerical stack pinned by tools/lib/py4dstem-ci-constraints.txt.
#
# WHAT IS EXCLUDED, AND WHY — silence is never the reason something is
# missing (docs/archive/v2/v2-release.md §3):
#   * `real-data-acceptance` — needs gitignored multi-GB acquisitions that
#     exist only on the release owner's machines.
#   * `package-test` (the rest of `run-tests.sh all`) — outside the
#     `unit` + `scientific` gate S21 names; the aggregate `all` claim is
#     restated by S19, not by this file.
#   * `tools/bragg-spacing-probe`, `tools/residency-sweep`,
#     `tools/real-acom-benchmark`, `tools/training-dataset-campaign`,
#     `tools/acom-groundtruth` — diagnostics that gate nothing and need
#     gitignored data or hand-supplied input.
#   * `tools/ui-smoke-test` — drives the app on screen via AppleScript and
#     needs an Accessibility (TCC) grant no hosted runner can give.
#   * `run-tests.sh benchmark` — machine-specific numbers, not pass/fail.
#   * On-screen verification — the owner drives the app and reports bugs
#     through /diagnose (CLAUDE.md). No runner can stand in for it; the
#     scripted checklist this line used to name was retired 2026-09-03 and is
#     archived at docs/archive/v2/visual-acceptance-checklist-2026-09-03.md.
#
# ALSO RUNS: `tools/run-tests.sh inventory` — the repo's own review. It FAILS
# on an unclassified `tools/` runner, on a presentation- or UI-contract grep,
# and on a live doc claiming uncommitted work. It only PRINTS the size metrics
# (live markdown, cold-start set, AppState): they set no return code, so no
# number rising can turn this red — the "must not go up" rule is the closeout
# skill's, enforced by a person. Note also that the uncommitted-claim check is
# skipped on a dirty tree, so locally it is nearly always inert; here, on a
# fresh checkout, it actually runs. And
# `tools/run-tests.sh core` — Core/ and Session/ as standalone packages; fails
# the moment Core/ depends on App/, UI/ or Support/.
#
# KNOWN CAVEATS, stated so a green run is not made to claim too much:
#   * S17 formally quarantines uncalibrated Prepare's sidebar height. The old
#     60pt allowance was justified with one machine's 49pt measurement, not a
#     stable product invariant. XCTest reports one explicit skip; the step
#     below exports its measured geometry, display scale, and WindowServer
#     state on every run. Track B remains the acceptance gate for that screen.
#   * macos-26 runners are the first automated exercise below the dev Mac's
#     macOS 27. That is build/numeric evidence only; no Track B pass has driven
#     the app on macOS 26 (docs/open-items.md).
#   * Xcode 26 ships the Metal compiler as a separate downloadable component;
#     both jobs install it if the image lacks it (the .metal shader compile in
#     `unit` and the GPU harnesses' `xcrun metal` need it). At runtime the GPU
#     harnesses assume the Apple Silicon runner's paravirtualized GPU exposes
#     a Metal device; MetalEngine fails loudly if it does not.
#   * The job timeouts are margin, not measurement — nothing has timed this
#     suite off the dev machine. Tighten them from the per-harness timings the
#     first green runs echo (`==> name … <== name (N s)` in the log).

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded branch/PR runs cancel; main runs always complete — on main each
  # commit's finished run IS the record (and an S17-intermittent observation).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit:
    name: unit (XCTest)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain on record
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
      - name: Ensure the Metal toolchain component
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version
      - name: Run the unit gate
        env:
          MAC4DSTEM_XCRESULT_BUNDLE_PATH: ${{ runner.temp }}/mac4dstem-unit.xcresult
        run: tools/run-tests.sh unit
      - name: Report the quarantined sidebar geometry
        if: always()
        run: |
          bundle="$RUNNER_TEMP/mac4dstem-unit.xcresult"
          output="$RUNNER_TEMP/mac4dstem-sidebar-diagnostics"
          if [[ -d "$bundle" ]]; then
            xcrun xcresulttool export attachments \
              --path "$bundle" --output-path "$output" \
              --filter 'sidebar-s17-*.txt'
            find "$output" -type f -name '*.txt' -exec sed -n '1,120p' {} \;
          else
            echo "No unit xcresult bundle; the build failed before diagnostics existed."
          fi

  scientific:
    name: scientific (py4DSTEM parity)
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain on record
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
      - name: Ensure the Metal toolchain component
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/lib/py4dstem-ci-constraints.txt
      - name: Fetch the py4DSTEM source lock
        # Since 2026-09-03 the lock is fetched at a pinned upstream commit
        # (tools/lib/fetch-py4dstem.sh), not tracked in the tree.
        run: tools/lib/fetch-py4dstem.sh
      - name: Install the py4DSTEM lock
        # Parity must run against the pinned source, never a PyPI
        # py4DSTEM — DEVIATION notes cite it by file and line. The constraints
        # file pins the numerical stack to the owner's parity environment so
        # an upstream release cannot shift the gate on an unchanged tree.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c tools/lib/py4dstem-ci-constraints.txt ./References/py4DSTEM-dev
          python -c "import py4DSTEM; print('py4DSTEM', py4DSTEM.__version__, py4DSTEM.__file__)"
      - name: Run the scientific gate
        # PYTHON is tools/lib/python.sh's documented override; vendor-reader
        # uses bare python3, which setup-python also puts on PATH.
        run: PYTHON="$(command -v python)" tools/run-tests.sh scientific

  inventory:
    name: inventory (repo review)
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the inventory
        run: tools/run-tests.sh inventory

  core:
    name: core (DSTEMCore + DSTEMSession package build)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain on record
        run: |
          xcode-select -p
          swift --version
      - name: Build the package layers standalone
        run: tools/run-tests.sh core

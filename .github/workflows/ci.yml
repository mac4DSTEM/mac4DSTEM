# CI — the aggregate claim, made mechanical (v2 S21, archived docs/archive/v2/v2-release.md §8).
#
# WHAT RUNS on every push and pull request — the jobs below, each a gate a public
# checkout can reproduce. `scientific` (up to three hours, not a required check)
# runs on push and workflow_dispatch only, never on a pull request, so a PR waits
# only for the required checks; dispatch CI on a branch to run it before merging.
# `kit boundary` is a plain grep and runs on Linux, off the macOS runner queue.
#   * `tools/run-tests.sh scientific`  — every harness in that script's
#     `scientific` array (the array is the roster; no count is stated here so
#     this comment cannot go stale), one half of one harness excepted (below).
#     Each builds its fixtures synthetically or reads small committed files and
#     compiles production Core/ sources standalone; the py4DSTEM-parity
#     harnesses among them compare against the pinned source lock
#     (References/py4DSTEM-dev, fetched by tools/lib/fetch-py4dstem.sh at one
#     upstream commit), with the numerical stack pinned by
#     tools/lib/py4dstem-ci-constraints.txt. The runner is a VM with no Neural
#     Engine and the app refuses the learned detector without one, so
#     tools/harnesses/tiled-detection-memory-test prints "learned half: SKIPPED on CI"
#     and gates its classical half only — the learned half runs locally
#     before every release. No other roster harness loads the learned model.
#   * `tools/run-tests.sh inventory`   — the repo's own review (below).
#   * `tools/run-tests.sh core`        — the package layers (below).
#
#   * `tools/run-tests.sh unit`        — the fast XCTest suite. Paused
#     2026-09-28 (ADR 040) while the app targeted macOS 27; back since the app
#     and MacEMUI 0.3.2 deploy to macOS 26 (2026-10-28).
#
# XCODE: every job uses Xcode 26.6 (DEVELOPER_DIR below), never the image's
# default, so an image update cannot change the toolchain on an unchanged tree.
#
# WHAT IS EXCLUDED, AND WHY — silence is never the reason something is
# missing (archived docs/archive/v2/v2-release.md §3):
#   * `real-data-acceptance` — needs gitignored multi-GB acquisitions that
#     exist only on the release owner's machines.
#   * The learned half of tiled-detection-memory-test (see above) — no
#     Neural Engine on the runner; the harness says so in the log.
#   * `package-test` (the rest of `run-tests.sh all`) — outside the
#     `unit` + `scientific` gate S21 names; the aggregate `all` claim is
#     restated by S19, not by this file.
#   * Diagnostic probes (bragg-spacing-probe, residency-sweep, real-acom-benchmark,
#     training-dataset-campaign, acom-groundtruth) — no longer in the repo; they
#     gated nothing and needed gitignored data or hand-supplied input.
#   * On-screen verification — done by hand with the built app. No runner can stand in for it; the
#     scripted checklist this line used to name was retired 2026-09-03 and is
#     archived as visual-acceptance-checklist-2026-09-03.md.
#
# INVENTORY: `tools/run-tests.sh inventory` — the repo's own review. It FAILS
# on an unclassified `tools/` runner, on a presentation- or UI-contract grep,
# on a live doc claiming uncommitted work, on an untracked file inside a
# bundled folder reference, and on the large-file allowlist, the validation badge
# and the harness compile path (lean cleanup 2026-10-21 dropped the doc-path,
# size and growth checks). Note that the uncommitted-claim check is skipped on a dirty tree, so
# locally it is nearly always inert; here, on a fresh checkout, it actually
# runs. And
# `tools/run-tests.sh core` — Core/ and Session/ as standalone packages; fails
# the moment Core/ depends on App/, UI/ or Support/.
#
# KNOWN CAVEATS, stated so a green run is not made to claim too much:
#   * macos-26 runners are the first automated exercise below the dev Mac's
#     macOS 27. That is build/numeric evidence only; no one has driven the app
#     on macOS 26 yet.
#   * Xcode 26 ships the Metal compiler as a separate downloadable component;
#     the scientific job installs it if the image lacks it (the GPU harnesses'
#     `xcrun metal` need it; so did the .metal compile in `unit`). At runtime
#     the GPU harnesses assume the Apple Silicon runner's paravirtualized GPU exposes
#     a Metal device; MetalEngine fails loudly if it does not.
#   * The job timeouts are margin, not measurement — nothing has timed this
#     suite off the dev machine. Tighten them from the per-harness timings the
#     first green runs echo (`==> name … <== name (N s)` in the log).

name: CI

on:
  # main and tags only: a PR branch's pushes run once, through pull_request (macEM-suite#77).
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded branch/PR runs cancel; main runs always complete — on main each
  # commit's finished run IS the record (and an S17-intermittent observation).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Pinned: the macos-26 image's Xcode 26.6 (Swift 6.3, macOS 26 SDK). Bump on purpose.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  unit:
    name: unit (XCTest)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain on record
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
      - name: Ensure the Metal toolchain component
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version
      - name: Run the unit gate
        run: tools/run-tests.sh unit

  scientific:
    name: scientific (py4DSTEM parity)
    # Off pull requests: the macOS runners are the CI bottleneck and this is the slowest, non-required job.
    if: github.event_name != 'pull_request'
    # The org's Mac runner while the org variable MACEM_MAC_RUNNER is set (never for a fork PR); else GitHub's macos-26.
    runs-on: ${{ vars.MACEM_MAC_RUNNER && !github.event.pull_request.head.repo.fork && fromJSON(vars.MACEM_MAC_RUNNER) || 'macos-26' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain on record
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
      - name: Ensure the Metal toolchain component
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version
      - uses: actions/setup-python@v7
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/lib/py4dstem-ci-constraints.txt
      # On the Mac runner setup-python would need sudo; uv puts a Python 3.12 venv (python, python3, pip) on PATH instead.
      - uses: astral-sh/setup-uv@v6
        if: runner.environment == 'self-hosted'
      - name: Python 3.12 venv (Mac runner)
        if: runner.environment == 'self-hosted'
        run: |
          uv venv --seed --python 3.12 "$RUNNER_TEMP/py"
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"
      - name: Fetch the py4DSTEM source lock
        # Since 2026-09-03 the lock is fetched at a pinned upstream commit
        # (tools/lib/fetch-py4dstem.sh), not tracked in the tree.
        run: tools/lib/fetch-py4dstem.sh
      - name: Install the py4DSTEM lock
        # Parity must run against the pinned source, never a PyPI
        # py4DSTEM — DEVIATION notes cite it by file and line. The constraints
        # file pins the numerical stack to the owner's parity environment so
        # an upstream release cannot shift the gate on an unchanged tree.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c tools/lib/py4dstem-ci-constraints.txt ./References/py4DSTEM-dev
          python -c "import py4DSTEM; print('py4DSTEM', py4DSTEM.__version__, py4DSTEM.__file__)"
      - name: Run the scientific gate
        # PYTHON is tools/lib/python.sh's documented override; vendor-reader
        # uses bare python3, which setup-python also puts on PATH.
        run: PYTHON="$(command -v python)" tools/run-tests.sh scientific

  inventory:
    name: inventory (repo review)
    # The org's Mac runner while the org variable MACEM_MAC_RUNNER is set (never for a fork PR); else GitHub's macos-26.
    runs-on: ${{ vars.MACEM_MAC_RUNNER && !github.event.pull_request.head.repo.fork && fromJSON(vars.MACEM_MAC_RUNNER) || 'macos-26' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The C5 growth rule reads HEAD^ on a clean tree. The default depth
          # of 1 does not have it, and the read used to fall through to zero,
          # so this job could never pass (found 2026-09-09).
          fetch-depth: 2
      - name: Resolve the kit pins
        # The redistributed-binaries check reads FormatoKit's libhdf5 from the pinned checkout.
        run: swift package resolve
      - name: Run the inventory
        run: tools/run-tests.sh inventory

  core:
    name: core (DSTEMCore + DSTEMSession package build)
    # The org's Mac runner while the org variable MACEM_MAC_RUNNER is set (never for a fork PR); else GitHub's macos-26.
    runs-on: ${{ vars.MACEM_MAC_RUNNER && !github.event.pull_request.head.repo.fork && fromJSON(vars.MACEM_MAC_RUNNER) || 'macos-26' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain on record
        run: |
          xcode-select -p
          swift --version
      - name: Build the package layers standalone
        run: tools/run-tests.sh core

  kit-boundary:
    name: kit boundary (no numerics frameworks in the app)
    # Plain bash, grep and awk: Linux runs it (checked with mawk), off the macOS queue.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Fail on Accelerate / Metal / vDSP outside the allowlist
        # Decision D15. Plain grep, no build; also part of `inventory`, kept as its own job so the red is named.
        run: tools/check-kit-boundary.sh

  private-refs:
    name: No private references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan tracked files
        run: |
          if git grep -n -I -E '_archive|CLAUDE\.md|memcap|macEM-suite|setup-python-refs' -- ':!.gitignore' ':!.github/workflows/ci.yml'; then
            echo "Private references above; this repo is public."; exit 1
          fi
